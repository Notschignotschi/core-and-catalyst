    <script>
        // Sobald die Website lädt, startet SOFORT der Ladebalken
        window.addEventListener('DOMContentLoaded', () => {
            startInitialLoading();
        });

        function startInitialLoading() {
            const statusText = document.getElementById('load-status');
            const bar = document.getElementById('bar');
            const steps = [
                "LADE INTERFACE-ELEMENTE...",
                "INITIALISIERE QUANTEN-NETZWERK...",
                "SYNCHRONISIERE REAKTIVE SPIEGELUNG...",
                "ÖFFNE INTEGRITÄTS-ZUGANG...",
                "NETZWERK BEREIT. INITIALISIERE LOGIN-SYSTEM!"
            ];
            
            let progress = 0; 
            let stepIndex = 0;
            
            const interval = setInterval(() => {
                progress += 2; 
                bar.style.width = progress + "%";
                
                if (progress % 22 === 0 && stepIndex < steps.length) { 
                    statusText.innerText = steps[stepIndex]; 
                    stepIndex++; 
                }
                
                if (progress >= 100) { 
                    clearInterval(interval); 
                    // Laden beendet! Wir blenden den Ladescreen aus und das Login-Terminal ein!
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('auth-screen').classList.remove('hidden');
                    
                    // KORREKTUR: Prüfe gezielt, ob ein Passwort-Schlüssel existiert (statt localStorage.length)
                    // Das verhindert den "White Screen" Fehler!
                    let hasAccounts = false;
                    for (let i = 0; i < localStorage.length; i++) {
                        if (localStorage.key(i).startsWith('dc_password_')) {
                            hasAccounts = true;
                            break;
                        }
                    }

                    if (hasAccounts) {
                        toggleAuth(false); // Zeige direkt den Login, falls Accounts existieren
                    } else {
                        toggleAuth(true);  // Zeige die Registrierung, falls alles leer ist
                    }
                }
            }, 50); // Regelt die Ladegeschwindigkeit am Anfang
        }

        function toggleAuth(showRegister) {
            document.getElementById('register-box').classList.toggle('hidden', !showRegister);
            document.getElementById('login-box').classList.toggle('hidden', showRegister);
        }

        function handleRegister() {
            const user = document.getElementById('reg-user').value.trim();
            const code = document.getElementById('reg-code').value.trim();
            if (!user || !code) return alert("Felder ausfüllen!");
            
            // KORREKTUR: Wir nutzen den exakten Datenbrücken-Schlüssel für die DB!
            if (localStorage.getItem('dc_password_' + user)) return alert("Name vergeben!");
        
            localStorage.setItem('dc_password_' + user, code); // Passwort in der DB verankern
            alert("Account erfolgreich angelegt!");
            toggleAuth(false);
        }

        function handleLogin() {
            const user = document.getElementById('login-user').value.trim();
            const code = document.getElementById('login-code').value.trim();
            if (!user || !code) return alert("Felder ausfüllen!");

            // Holt das gespeicherte Passwort aus dem Speicher
            const savedCode = localStorage.getItem('dc_password_' + user);

            if (savedCode && savedCode === code) {
                // KORREKTUR: Commander für database.js im Session-Speicher verankern!
                sessionStorage.setItem('active_commander', user);
                
                alert("Zugang gewährt! Weiterleitung zum Hangar...");
                window.location.href = "hangar.html"; // Leitet den Spieler weiter
            } else {
                alert("Commander-Name oder Zugangs-Code falsch!");
            }
        }
    </script>
</body>
</html>
