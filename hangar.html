<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core & Catalyst - Hangar</title>
    <style>
        body { 
            background-color: #05060a; 
            color: #e6e6e6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        h2 { color: #ff6600; text-shadow: 0 0 10px rgba(255, 102, 0, 0.4); margin: 0 0 5px 0; letter-spacing: 1px; }
        
        .hud { background-color: #0f111a; border: 2px solid #00ffcc; border-radius: 10px; padding: 12px; max-width: 700px; margin: 0 auto 15px auto; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 0 15px rgba(0, 255, 204, 0.1); }
        .hud-block { text-align: center; }
        .credits { font-size: 22px; color: #00ffcc; font-weight: bold; }
        
        #canvas-container { width: 100%; height: 300px; background: radial-gradient(circle, #171b2a 0%, #07080c 100%); margin: 0 auto 15px auto; max-width: 700px; border-radius: 10px; border: 1px solid #333; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        
        .dock-controls { max-width: 700px; margin: 0 auto 15px auto; display: flex; gap: 15px; justify-content: center; }
        .dock-panel { flex: 1; background: #0f111a; border: 1px solid #222; padding: 15px; border-radius: 10px; text-align: left; }
        .dock-panel h3 { margin: 0 0 10px 0; color: #ff6600; font-size: 14px; letter-spacing: 1px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        
        .btn-disabled { background-color: #222; color: #555; border: 1px solid #333; padding: 8px 12px; font-size: 13px; border-radius: 5px; font-weight: bold; width: 100%; cursor: not-allowed; margin-bottom: 8px; }
        .btn-action { background-color: #ff6600; color: white; border: none; padding: 8px 12px; font-size: 13px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 8px; transition: 0.2s; text-align: center; }
        .btn-action:hover { background-color: #ff8533; transform: scale(1.02); }
        
        /* DAS LIVE-IFRAME FÜR DAS SEPARATE CHAT-MODUL */
        .chat-frame { width: 100%; max-width: 700px; height: 180px; border: 1px solid #333; border-radius: 10px; overflow: hidden; background-color: #0f111a; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h2>🛰️ RECHNER-HANGAR & GEFECHTSBRÜCKE</h2>
    <p style="margin: 0 0 15px 0; font-size: 14px; color: #aaa;">Sektor-Flugstatus von: <span id="player-name" style="color:#00ffcc; font-weight:bold;">Commander</span> 👑</p>

    <div class="hud">
        <div class="hud-block">
            <div style="font-size: 10px; color: #666; letter-spacing: 0.5px;">KRYPTO-TRESOR (STUFE 5)</div>
            <div class="credits"><span id="credit-count">2.390.000</span> / 5.000.000 💳</div>
        </div>
        <div class="hud-block">
            <div style="font-size: 10px; color: #666; letter-spacing: 0.5px;">MINEN-PRODUKTION</div>
            <div style="color: #ff6600; font-weight: bold; font-size: 18px;">+<span id="speed-count">900</span> / Sek</div>
        </div>
        <div class="hud-block">
            <div style="font-size: 10px; color: #666; letter-spacing: 0.5px;">META-LISTE</div>
            <div style="color: #00ffcc; font-weight: bold; font-size: 18px;"><span id="parts-count">37</span> / 1000</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div class="dock-controls">
        <div class="dock-panel">
            <h3>🔧 ERWEITERTE KOMPONENTEN</h3>
            <button class="btn-disabled" disabled>🛍️ Teil #769: Kollisions-Railgun (Gesperrt)</button>
            <button class="btn-disabled" disabled>🛍️ Teil #421: Kryo-Schnitt-Matrix (Gesperrt)</button>
        </div>
        <div class="dock-panel">
            <h3>🎨 HÜLLEN-STRUKTUR & LACKIERUNG</h3>
            <button class="btn-action" onclick="changeDesign(0x222530, 0xff5500, 'Dorfchaoten-Original (Matt-Anthrazit & Orange)')">✨ Dorfchaoten (Anthrazit/Orange)</button>
            <button class="btn-action" onclick="changeDesign(0x0a2412, 0x00ff55, 'Viper-Overdrive (Nova-Giftgrün Modus)')">🐍 Viper-Style (Nova-Giftgrün)</button>
            <button class="btn-action" onclick="changeDesign(0x0c1f30, 0x00ffcc, 'Amboss-Titanpanzerung (Neon-Cyan Modus)')">🛡️ Amboss-Style (Neon-Cyan)</button>
        </div>
    </div>

    <!-- DER INTEGRATIONS-KNOTEN FÜR DIE CHAT.HTML -->
    <iframe src="chat.html" class="chat-frame" id="chat-window"></iframe>

    <script>
        let credits = 2390000;
        let parts = 37;
        let mineSpeed = 900;
        let pName = sessionStorage.getItem('active_commander') || "Commander";

        document.getElementById('player-name').innerText = pName;

        // Wirtschaftstaktung
        setInterval(() => {
            if (credits < 5000000) {
                credits += mineSpeed;
                if (credits > 5000000) credits = 5000000;
                document.getElementById('credit-count').innerText = credits.toLocaleString('de-DE');
            }
        }, 1000);

        // STABILE THREE.JS ENGINE
        let ship, light1, light2;
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x444444);
        scene.add(ambient);
        light1 = new THREE.DirectionalLight(0xff5500, 2.0); light1.position.set(5, 5, 5); scene.add(light1);
        light2 = new THREE.DirectionalLight(0x00ffcc, 1.0); light2.position.set(-5, 2, -3); scene.add(light2);

        const geometry = new THREE.ConeGeometry(0.6, 1.8, 4);
        const material = new THREE.MeshStandardMaterial({ color: 0x222530, roughness: 0.4, metalness: 0.8 });
        ship = new THREE.Mesh(geometry, material);
        ship.rotation.x = Math.PI / 2;
        scene.add(ship);

        let clock = new THREE.Clock();
        function renderLoop() {
            requestview = requestAnimationFrame(renderLoop);
            if(ship) { ship.rotation.z += 0.003; ship.position.y = Math.sin(clock.getElapsedTime() * 1.5) * 0.05; }
            renderer.render(scene, camera);
        }
        renderLoop();

        // SIGNAL-BRÜCKE ZWISCHEN CHAT UND HANGAR (Für Cheats und Logs)
        window.addEventListener('message', function(e) {
            if(e.data.type === 'CHEAT') {
                if (e.data.command === 'money') { credits += 1000000; if(credits > 5000000) credits = 5000000; }
                if (e.data.command === 'parts') { parts = 999; document.getElementById('parts-count').innerText = parts; }
                if (e.data.command === 'speed') { mineSpeed = 50000; document.getElementById('speed-count').innerText = mineSpeed; }
                document.getElementById('credit-count').innerText = credits.toLocaleString('de-DE');
            }
        });

        function changeDesign(hullColor, glowColor, logMessage) {
            if(ship && light1) {
                ship.material.color.setHex(hullColor);
                light1.color.setHex(glowColor);
                
                // Wir funken den Text rüber an das separate Chat-Modul, damit es dort im Log steht!
                const chatWindow = document.getElementById('chat-window').contentWindow;
                chatWindow.postMessage({ type: 'LOG', message: logMessage }, '*');
            }
        }
    </script>
</body>
</html>
