<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core & Catalyst - Hangar</title>
    <style>
        body { 
            background-color: #05060a; 
            color: #e6e6e6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        h2 { color: #ff6600; text-shadow: 0 0 10px rgba(255, 102, 0, 0.4); margin: 0 0 5px 0; letter-spacing: 1px; }
        
        /* LIVE HUD */
        .hud { background-color: #0f111a; border: 2px solid #00ffcc; border-radius: 10px; padding: 12px; max-width: 700px; margin: 0 auto 15px auto; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 0 15px rgba(0, 255, 204, 0.1); }
        .hud-block { text-align: center; }
        .credits { font-size: 24px; color: #00ffcc; font-weight: bold; }
        
        /* 3D VIEWPORT */
        #canvas-container { 
            width: 100%; 
            height: 340px; 
            background: radial-gradient(circle, #141724 0%, #07080c 100%); 
            margin: 0 auto 15px auto; 
            max-width: 700px; 
            border-radius: 10px; 
            border: 1px solid #333; 
        }
        
        .chat-frame { width: 100%; max-width: 700px; height: 180px; border: 1px solid #333; border-radius: 10px; overflow: hidden; background-color: #0f111a; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h2>🛰️ RECHNER-HANGAR & GEFECHTSBRÜCKE</h2>
    <p style="margin: 0 0 15px 0; font-size: 14px; color: #aaa;">Sektor-Flugstatus: <span style="color:#00ffcc; font-weight:bold;">Aktiv</span> 👑</p>

    <!-- LIVE HUD -->
    <div class="hud">
        <div class="hud-block">
            <div style="font-size: 10px; color: #666; letter-spacing: 0.5px;">KRYPTO-TRESOR</div>
            <div class="credits" id="credit-display">0 💳</div>
        </div>
        <div class="hud-block">
            <div style="font-size: 10px; color: #666; letter-spacing: 0.5px;">MINEN-PRODUKTION</div>
            <div style="color: #ff6600; font-weight: bold; font-size: 18px;">+<span id="speed-count">900</span> / Sek</div>
        </div>
    </div>

    <!-- HANGAR VIEWPORT FOR 3D MODEL -->
    <div id="canvas-container"></div>

    <iframe src="chat.html" class="chat-frame" id="chat-window"></iframe>

    <script>
        let credits = 2390000;
        let mineSpeed = 900;

        function drawHUD() {
            const element = document.getElementById('credit-display');
            if (element) {
                element.innerText = credits.toLocaleString('de-DE') + " 💳";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('speed-count').innerText = mineSpeed;
            drawHUD();

            setInterval(() => {
                credits += mineSpeed;
                drawHUD();
            }, 1000);
        });

        window.addEventListener('message', function(e) {
            if(e.data.type === 'CHEAT') {
                if (e.data.command === 'money') { credits += 1000000; }
                if (e.data.command === 'speed') { mineSpeed = 50000; document.getElementById('speed-count').innerText = mineSpeed; }
                drawHUD();
            }
        });

        // --- THREE.JS 3D ENGINE (PERFEKTE SEITENANSICHT) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // KAMERA-POSITION: Wir setzen die Kamera seitlich auf die X-Achse (X = 3.5), damit man das Schiff perfekt von der Flanke sieht
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(3.5, 0.3, 0); 
        camera.lookAt(0, 0, 0); // Kamera blickt exakt zentriert auf die Mitte des Schiffs

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Lichteffekte passend für die Flankenbeleuchtung platziert
        const light1 = new THREE.DirectionalLight(0xff5500, 2.0); light1.position.set(5, 3, 5); scene.add(light1);
        const light2 = new THREE.DirectionalLight(0x00ffcc, 1.0); light2.position.set(-5, 2, -3); scene.add(light2);

        // Das schwebende Geometrie-Schiff (Kegel-Form)
        const geometry = new THREE.ConeGeometry(0.5, 2.0, 4);
        const material = new THREE.MeshStandardMaterial({ color: 0x11131a, roughness: 0.4, metalness: 0.8 });
        const ship = new THREE.Mesh(geometry, material);
        
        // SCHIFFS-DREHUNG: Das Schiff liegt flach im Raum, die Spitze zeigt nach vorne (entlang der Z-Achse)
        ship.rotation.x = Math.PI / 2; 
        scene.add(ship);

        let clock = new THREE.Clock();
        function renderLoop() {
            requestAnimationFrame(renderLoop);
            if (ship) {
                // Sanfte Drehung um die eigene Hochachse (Y-Achse im lokalen Raum)
                ship.rotation.z += 0.005; 
                // Elegantes Auf- und Ab-Schweben im Hangar-Standby
                ship.position.y = Math.sin(clock.getElapsedTime() * 1.5) * 0.06; 
            }
            renderer.render(scene, camera);
        }
        renderLoop();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
